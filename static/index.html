<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐳 Docker API Admin Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e2e8f0;
            padding: 24px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        h1 span {
            background: #3b82f6;
            color: white;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: normal;
        }
        
        .subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 16px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge.get { background: #2e7d5e; color: #d1fae5; }
        .badge.post { background: #2563eb; color: #dbeafe; }
        .badge.put { background: #b45309; color: #ffedd5; }
        .badge.delete { background: #b91c1c; color: #fee2e2; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }
        
        .card:hover {
            border-color: #3b82f6;
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.2);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .endpoint {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            margin-bottom: 16px;
            border: 1px solid #334155;
            color: #94a3b8;
            word-break: break-all;
        }
        
        .param-group {
            margin-bottom: 16px;
        }
        
        .param-label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .response {
            margin-top: 16px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
            display: none;
        }
        
        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #1a2538;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
        }
        
        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        
        .status.success { background: #2e7d5e; color: #d1fae5; }
        .status.error { background: #b91c1c; color: #fee2e2; }
        .status.pending { background: #b45309; color: #ffedd5; }
        
        .response-body {
            padding: 12px;
            max-height: 300px;
            overflow: auto;
        }
        
        pre {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #bbd7fb;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .sse-section {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            margin-top: 30px;
        }
        
        .sse-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .sse-controls {
            flex: 1;
            min-width: 300px;
        }
        
        .sse-stream {
            flex: 2;
            min-width: 300px;
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        
        .sse-message {
            padding: 8px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
        }
        
        .sse-message:last-child {
            border-bottom: none;
        }
        
        .timestamp {
            color: #6b7280;
            font-size: 0.7rem;
            margin-right: 8px;
        }
        
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn-secondary {
            background: #4b5563;
        }
        
        .btn-secondary:hover {
            background: #6b7280;
        }
        
        .btn-danger {
            background: #b91c1c;
        }
        
        .btn-danger:hover {
            background: #991b1b;
        }
        
        .status-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-badge.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .status-badge.offline { background: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🐳 Docker API Control Panel
            <span id="apiStatus" class="offline">Проверка...</span>
        </h1>
        <div class="subtitle">
            Полный интерфейс для управления Docker контейнерами через API
            <span style="margin-left: 16px; color: #3b82f6;">http://localhost:8000</span>
        </div>

        <!-- Основная сетка карточек -->
        <div class="grid" id="cardsGrid"></div>

        <!-- SSE секция -->
        <div class="sse-section">
            <h3 style="margin-bottom: 16px;">📡 SSE Stream (Live Updates)</h3>
            <div class="sse-container">
                <div class="sse-controls">
                    <div class="param-group">
                        <label class="param-label">Container ID для стрима uptime:</label>
                        <div class="flex-row">
                            <input type="text" id="sseContainerId" placeholder="Введите container ID" value="test_container" style="flex: 1;">
                            <button id="startSseBtn" class="btn-secondary">▶ Старт</button>
                            <button id="stopSseBtn" class="btn-danger">⏹ Стоп</button>
                        </div>
                    </div>
                </div>
                <div class="sse-stream" id="sseStream">
                    <div style="color: #6b7280; text-align: center;">SSE stream не активен</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        let sseSource = null;

        // Проверка статуса API
        async function checkApiStatus() {
            const statusEl = document.getElementById('apiStatus');
            try {
                const res = await fetch(`${BASE_URL}/`);
                const data = await res.json();
                if (data.docker) {
                    statusEl.className = 'online';
                    statusEl.innerHTML = '● API Online (Docker OK)';
                } else {
                    statusEl.className = 'offline';
                    statusEl.innerHTML = '● API Online (Docker недоступен)';
                }
            } catch (e) {
                statusEl.className = 'offline';
                statusEl.innerHTML = '● API Offline';
            }
        }

        // Конфигурация эндпоинтов
        const endpoints = [
            {
                name: '🏠 Главная',
                method: 'GET',
                path: '/',
                description: 'Проверка статуса API',
                needId: false,
                needBody: false,
                color: 'get'
            },
            {
                name: '📦 Список контейнеров',
                method: 'GET',
                path: '/containers',
                description: 'Все контейнеры (включая остановленные)',
                needId: false,
                needBody: false,
                color: 'get'
            },
            {
                name: '🖼 Список образов',
                method: 'GET',
                path: '/images',
                description: 'Все Docker образы',
                needId: false,
                needBody: false,
                color: 'get'
            },
            {
                name: '🌐 IP контейнера',
                method: 'GET',
                path: '/container/{id}/ip',
                description: 'Получить IP адреса контейнера',
                needId: true,
                needBody: false,
                placeholderId: 'test_container',
                color: 'get'
            },
            {
                name: '⚡ CPU контейнера',
                method: 'GET',
                path: '/container/{id}/cpu',
                description: 'Использование CPU',
                needId: true,
                needBody: false,
                placeholderId: 'test_container',
                color: 'get'
            },
            {
                name: '⏱ Uptime контейнера',
                method: 'GET',
                path: '/container/{id}/uptime',
                description: 'Время работы',
                needId: true,
                needBody: false,
                placeholderId: 'test_container',
                color: 'get'
            },
            {
                name: '✨ Создать контейнер',
                method: 'GET',
                path: '/create',
                description: 'Создать новый контейнер (GET параметры)',
                needId: false,
                needBody: false,
                params: [
                    { name: 'name', placeholder: 'my_container', value: 'test_container' },
                    { name: 'image', placeholder: 'ubuntu', value: 'ubuntu' },
                    { name: 'cmd', placeholder: 'sleep 3600', value: 'sleep 3600' }
                ],
                color: 'post'
            },
            {
                name: '🗑 Удалить контейнер',
                method: 'GET',
                path: '/remove',
                description: 'Удалить контейнер (GET параметр)',
                needId: false,
                needBody: false,
                params: [
                    { name: 'name', placeholder: 'container_name', value: 'test_container' }
                ],
                color: 'delete'
            },
            {
                name: '📊 Собрать данные',
                method: 'GET',
                path: '/collect/{id}',
                description: 'Собрать всю инфу о контейнере',
                needId: true,
                needBody: false,
                placeholderId: 'test_container',
                color: 'get'
            }
        ];

        function createCard(ep) {
            const card = document.createElement('div');
            card.className = 'card';

            // Header
            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `
                <span class="card-title">${ep.name}</span>
                <span class="badge ${ep.color}">${ep.method}</span>
            `;
            card.appendChild(header);

            // Description
            const desc = document.createElement('div');
            desc.style.fontSize = '0.85rem';
            desc.style.color = '#94a3b8';
            desc.style.marginBottom = '12px';
            desc.textContent = ep.description;
            card.appendChild(desc);

            // Endpoint URL
            const urlDiv = document.createElement('div');
            urlDiv.className = 'endpoint';
            urlDiv.textContent = ep.path;
            card.appendChild(urlDiv);

            const inputs = {};

            // Dynamic params or ID
            if (ep.params) {
                ep.params.forEach(param => {
                    const group = document.createElement('div');
                    group.className = 'param-group';
                    
                    const label = document.createElement('label');
                    label.className = 'param-label';
                    label.textContent = param.name + ':';
                    group.appendChild(label);
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = param.placeholder;
                    input.value = param.value || '';
                    input.id = `input_${ep.path}_${param.name}`;
                    group.appendChild(input);
                    
                    card.appendChild(group);
                    inputs[param.name] = input;
                });
            } else if (ep.needId) {
                const group = document.createElement('div');
                group.className = 'param-group';
                
                const label = document.createElement('label');
                label.className = 'param-label';
                label.textContent = 'Container ID:';
                group.appendChild(label);
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = ep.placeholderId || 'Введите container ID';
                input.value = ep.placeholderId || '';
                input.id = `input_${ep.path}_id`;
                group.appendChild(input);
                
                card.appendChild(group);
                inputs.id = input;
            }

            // Body textarea if needed
            if (ep.needBody) {
                const group = document.createElement('div');
                group.className = 'param-group';
                
                const label = document.createElement('label');
                label.className = 'param-label';
                label.textContent = 'JSON Body:';
                group.appendChild(label);
                
                const textarea = document.createElement('textarea');
                textarea.placeholder = '{}';
                textarea.value = ep.placeholderBody || '{\n  "key": "value"\n}';
                textarea.id = `body_${ep.path}`;
                group.appendChild(textarea);
                
                card.appendChild(group);
                inputs.body = textarea;
            }

            // Button
            const button = document.createElement('button');
            button.innerHTML = '🚀 Отправить запрос';
            card.appendChild(button);

            // Response div
            const responseDiv = document.createElement('div');
            responseDiv.className = 'response';
            card.appendChild(responseDiv);

            // Button click handler
            button.addEventListener('click', async () => {
                let url = BASE_URL + ep.path;
                const queryParams = new URLSearchParams();

                // Build URL with params
                if (ep.params) {
                    Object.keys(inputs).forEach(key => {
                        if (key !== 'body') {
                            queryParams.append(key, inputs[key].value);
                        }
                    });
                    url += '?' + queryParams.toString();
                } else if (ep.needId && inputs.id) {
                    url = url.replace('{id}', inputs.id.value);
                }

                responseDiv.style.display = 'block';
                responseDiv.innerHTML = `
                    <div class="response-header">
                        <span>⏳ Выполняется...</span>
                        <span class="status pending">Pending</span>
                    </div>
                `;

                try {
                    const options = {
                        method: ep.method,
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    };

                    if (inputs.body) {
                        try {
                            JSON.parse(inputs.body.value);
                            options.body = inputs.body.value;
                        } catch (e) {
                            responseDiv.innerHTML = `
                                <div class="response-header">
                                    <span>❌ Ошибка</span>
                                    <span class="status error">Invalid JSON</span>
                                </div>
                                <div class="response-body">
                                    <pre>Тело запроса должно быть валидным JSON</pre>
                                </div>
                            `;
                            return;
                        }
                    }

                    const startTime = Date.now();
                    const res = await fetch(url, options);
                    const time = Date.now() - startTime;
                    
                    let data;
                    const contentType = res.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        data = await res.json();
                    } else {
                        data = await res.text();
                    }

                    responseDiv.innerHTML = `
                        <div class="response-header">
                            <span>📦 Ответ (${time}ms)</span>
                            <span class="status ${res.ok ? 'success' : 'error'}">${res.status} ${res.statusText}</span>
                        </div>
                        <div class="response-body">
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } catch (error) {
                    responseDiv.innerHTML = `
                        <div class="response-header">
                            <span>❌ Ошибка сети</span>
                            <span class="status error">Failed</span>
                        </div>
                        <div class="response-body">
                            <pre>${error.message}</pre>
                        </div>
                    `;
                }
            });

            return card;
        }

        // Render all cards
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            endpoints.forEach(ep => {
                grid.appendChild(createCard(ep));
            });
        }

        // SSE functionality
        function setupSSE() {
            const sseContainer = document.getElementById('sseContainerId');
            const streamDiv = document.getElementById('sseStream');
            const startBtn = document.getElementById('startSseBtn');
            const stopBtn = document.getElementById('stopSseBtn');

            startBtn.addEventListener('click', () => {
                if (sseSource) {
                    sseSource.close();
                }

                const containerId = sseContainer.value.trim();
                if (!containerId) {
                    alert('Введите container ID');
                    return;
                }

                streamDiv.innerHTML = '<div style="color: #3b82f6;">🔄 Подключение к SSE...</div>';
                
                sseSource = new EventSource(`${BASE_URL}/sse/container/${containerId}/uptime`);
                
                sseSource.onopen = () => {
                    streamDiv.innerHTML = '<div style="color: #10b981;">✅ SSE подключено</div>';
                };
                
                sseSource.onmessage = (event) => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'sse-message';
                    
                    const time = new Date().toLocaleTimeString();
                    let data = event.data;
                    
                    // Try to pretty print JSON
                    try {
                        const jsonData = JSON.parse(data);
                        data = JSON.stringify(jsonData, null, 2);
                    } catch (e) {
                        // keep as is
                    }
                    
                    msgDiv.innerHTML = `<span class="timestamp">[${time}]</span> <pre style="display: inline; color: #bbd7fb;">${data}</pre>`;
                    
                    streamDiv.appendChild(msgDiv);
                    // Keep only last 10 messages
                    while (streamDiv.children.length > 10) {
                        streamDiv.removeChild(streamDiv.firstChild);
                    }
                    // Auto-scroll
                    streamDiv.scrollTop = streamDiv.scrollHeight;
                };
                
                sseSource.onerror = () => {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'sse-message';
                    errorDiv.style.color = '#b91c1c';
                    errorDiv.innerHTML = `<span class="timestamp">[${new Date().toLocaleTimeString()}]</span> ❌ Ошибка соединения`;
                    streamDiv.appendChild(errorDiv);
                    
                    if (sseSource.readyState === EventSource.CLOSED) {
                        sseSource.close();
                        sseSource = null;
                    }
                };
            });

            stopBtn.addEventListener('click', () => {
                if (sseSource) {
                    sseSource.close();
                    sseSource = null;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'sse-message';
                    msgDiv.style.color = '#b45309';
                    msgDiv.innerHTML = `<span class="timestamp">[${new Date().toLocaleTimeString()}]</span> ⏹ SSE остановлен`;
                    streamDiv.appendChild(msgDiv);
                }
            });
        }

        // Initialize
        checkApiStatus();
        renderCards();
        setupSSE();

        // Refresh API status every 10 seconds
        setInterval(checkApiStatus, 10000);
    </script>
</body>
</html>
