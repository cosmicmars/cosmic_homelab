<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic — Логи контейнеров</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/stil.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* центрирование блока логов и серая подложка */
        .logs-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }
        .logs-stream {
            background: #0f1217;
            border-radius: 20px;
            padding: 20px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            max-height: 500px;
            overflow-y: auto;
        }
        .log-line {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .log-timestamp {
            color: #6c7a89;
            margin-right: 12px;
            font-size: 0.7rem;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls input {
            flex: 2;
            min-width: 200px;
        }
        .controls button {
            width: auto;
            padding: 10px 24px;
        }
    </style>
</head>
<body>
    <header class="hed">
        <div class="left"><span class="brand">Cosmic</span></div>
        <nav class="nav">
            <a href="/static/index.html">Dashboard</a>
            <a href="server.html">Servers</a>
            <a href="container.html">Containers</a>
            <a href="alert.html">Alerts</a>
            <a class="active" href="logs.html">Logs</a>
        </nav>
        <div class="right"><button class="settings">Settings</button></div>
    </header>

    <main class="wrap">
        <div class="logs-container">
            <div class="sse-section" style="margin-top: 0; background: transparent; border: none; padding: 0;">
                <h3 style="text-align: center; margin-bottom: 1rem;">📄 Логи контейнера (Live stream)</h3>
                <div class="controls">
                    <input type="text" id="containerIdInput" class="param-input" placeholder="ID или имя контейнера (alpha, beta...)" autocomplete="off">
                    <button id="startLogsBtn" class="btn-secondary">▶ Старт поток</button>
                    <button id="stopLogsBtn" class="btn-danger" disabled>⏹ Стоп</button>
                </div>
                <div id="logsStream" class="logs-stream">
                    <div style="color: #6b7280; text-align: center;">Введите ID контейнера и нажмите «Старт»</div>
                </div>
            </div>
        </div>
    </main>

    <canvas id="starsCanvas"></canvas>

    <script>
        (function() {
            const BASE_URL = 'http://127.0.0.1:8000';
            let eventSource = null;

            const containerInput = document.getElementById('containerIdInput');
            const startBtn = document.getElementById('startLogsBtn');
            const stopBtn = document.getElementById('stopLogsBtn');
            const logsContainer = document.getElementById('logsStream');

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function addLogLine(line) {
                const time = new Date().toLocaleTimeString();
                const lineDiv = document.createElement('div');
                lineDiv.className = 'log-line';
                lineDiv.innerHTML = `<span class="log-timestamp">[${time}]</span> ${escapeHtml(line)}`;
                logsContainer.appendChild(lineDiv);
                // ограничиваем количество строк
                while (logsContainer.children.length > 500) {
                    logsContainer.removeChild(logsContainer.firstChild);
                }
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            function clearLogs() {
                logsContainer.innerHTML = '';
            }

            function startLogs() {
                const containerId = containerInput.value.trim();
                if (!containerId) {
                    alert('Введите ID или имя контейнера');
                    return;
                }

                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }

                clearLogs();
                const url = `${BASE_URL}/sse/container/${containerId}/logs`;
                eventSource = new EventSource(url);

                eventSource.onopen = () => {
                    console.log(`SSE connected for ${containerId}`);
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'log-line';
                    infoDiv.style.color = '#4de6d1';
                    infoDiv.innerHTML = `<span class="log-timestamp">[${new Date().toLocaleTimeString()}]</span> ✅ Поток логов установлен`;
                    logsContainer.appendChild(infoDiv);
                };

                eventSource.onmessage = (event) => {
                    if (event.data) {
                        addLogLine(event.data);
                    }
                };

                eventSource.onerror = (err) => {
                    console.error('SSE error', err);
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'log-line';
                    errorDiv.style.color = '#ff6b6b';
                    errorDiv.innerHTML = `<span class="log-timestamp">[${new Date().toLocaleTimeString()}]</span> ❌ Ошибка подключения. Проверьте контейнер и API.`;
                    logsContainer.appendChild(errorDiv);
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                };
            }

            function stopLogs() {
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                startBtn.disabled = false;
                stopBtn.disabled = true;
                const stopDiv = document.createElement('div');
                stopDiv.className = 'log-line';
                stopDiv.style.color = '#ff9f4a';
                stopDiv.innerHTML = `<span class="log-timestamp">[${new Date().toLocaleTimeString()}]</span> ⏹ Поток логов остановлен`;
                logsContainer.appendChild(stopDiv);
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            startBtn.addEventListener('click', startLogs);
            stopBtn.addEventListener('click', stopLogs);

            // Закрываем SSE при уходе со страницы
            window.addEventListener('beforeunload', () => {
                if (eventSource) eventSource.close();
            });
        })();
    </script>
    <!-- Если требуется общий скрипт, оставьте его, но лучше не подключать, чтобы избежать конфликтов -->
    <script src="/static/scr.js"></script>
</body>
</html>
